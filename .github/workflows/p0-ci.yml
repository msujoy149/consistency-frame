# Consistency Frame P0 CI — pull requests and pushes to main / feature branches.
# Small and deterministic: shell syntax, schema/registry validation,
# installer regression tests, private-overlay and secret checks, and
# living-report consistency. No services, no model downloads, no paid APIs.
#
# actions/checkout is pinned to its full commit SHA (v4.2.2).
# actions/setup-python is pinned to its full commit SHA (v5.6.0, the
# v5 tag — verified with git ls-remote against the upstream repo).
# No other third-party action is used.
#
# Two jobs: p0-validate runs the full Linux suite; windows-compat
# (added CF-WO-P1-001-R2) runs the runtime regression suites
# natively on Windows (Python 3.10 and 3.12), including the real
# multiprocessing first-run race test under the spawn start
# method. The Windows job produces no last-run.json artefact —
# its evidence is the job log (the suites' PASS lines).
# (CF-WO-P1-005-R4, E): p0-validate installs FFmpeg/ffprobe
# (Ubuntu package) so the end-to-end integration test runs for
# real — it fails, never skips, when FFmpeg is absent. The
# windows-compat job does not install FFmpeg: the e2e suite
# does not run there, and the URL-security suite does not run
# there either (its pinned-TLS group needs the openssl CLI,
# which is not confirmed on the Windows runner's PATH).
name: P0 CI

on:
  pull_request:
  push:
    branches: [main, feat/cf-p0-safe-foundations]

jobs:
  p0-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Show versions
        run: |
          bash --version | head -1
          python3 --version
          git --version
      - name: Install PyYAML (needed by scripts/validate-repo.py check 8, tests/test_routing.py and scripts/generate-routing-catalog.py)
        run: python3 -m pip install --quiet pyyaml
      - name: Install FFmpeg (required by the R4 end-to-end test)
        # CF-WO-P1-005-R4 (E): the local end-to-end integration
        # test (tests/test_e2e_local.py) exercises real
        # FFmpeg/ffprobe operations and FAILS — it never skips —
        # when they are absent, so skipped FFmpeg tests can never
        # count as integration coverage. The Ubuntu package is
        # the known supported build for this job; the step prints
        # both versions and the test records them in its
        # evidence record.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Check routing catalog is fresh
        # CF-WO-P1-002: the compiled catalog (registry/routing-catalog.json)
        # must match the canonical routing sources. This step fails the
        # job when it is stale; tests/run-tests.sh runs the same check
        # (CF-P1-002-CATALOG), so local and CI agree.
        run: python3 scripts/generate-routing-catalog.py --check
      - name: Run P0 tests
        run: bash tests/run-tests.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (verified via GitHub API 2026-11-22)
        with:
          name: p0-test-results
          path: tests/last-run.json

  windows-compat:
    # Native Windows verification of the runtime suites
    # (CF-WO-P1-001-R2): the profile-publication path must work
    # without os.fchmod (absent on Windows Python 3.10-3.12),
    # and the first-run race test must pass under the spawn
    # start method — spawn is the only start method on Windows.
    # (CF-WO-P1-002-R1): the skill router suite runs here too —
    # the router is platform-independent runtime code and gets
    # native verification on both matrix versions.
    # Runs on pull_request (and the same push branches as
    # p0-validate); the P1 branch is deliberately NOT added to
    # the push list — the PR run is the CI evidence, as in
    # P1-001/R1.
    runs-on: windows-latest
    strategy:
      # fail-fast is false (R2 follow-up): the default fail-fast
      # cancelled the Python 3.10 job when 3.12 failed in PR run
      # #216, so 3.10 never ran any test. Each version's result
      # must stand on its own.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (v5)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show versions
        shell: bash
        run: |
          python --version
          python -c "import multiprocessing, sys; print('start method:', multiprocessing.get_start_method()); print(sys.platform)"
      - name: Install PyYAML (needed by tests/test_routing.py and scripts/generate-routing-catalog.py)
        # CF-WO-P1-002-R1-R1: the router suite runs
        # scripts/generate-routing-catalog.py --check, which needs
        # PyYAML. p0-validate installs it; windows-compat never
        # did, so the router step failed in PR run #237 with
        # "generate-routing-catalog: PyYAML is required
        # (pip install pyyaml)". `python` (not `python3`) is the
        # interpreter on the Windows runner.
        shell: bash
        run: python -m pip install --quiet pyyaml
      - name: Run local session runtime suite
        # bash (Git Bash on the Windows runner) so a non-zero
        # exit fails the step immediately, the same as on Linux.
        # One step per suite (R2 follow-up): a failure in one
        # suite must not hide the others — the single-step
        # form stopped at the first failure and left the other
        # suites unrun. The race test (FIRST-01..07) runs for
        # real here under spawn; its PASS lines must appear in
        # the log — no test is skipped for the platform.
        shell: bash
        run: python tests/test_local_session_runtime.py
      - name: Run session authorization suite
        shell: bash
        run: python tests/test_session_authorization.py
      - name: Run private voice security suite
        shell: bash
        run: python tests/test_private_voice_security.py
      - name: Run skill router suite
        # CF-WO-P1-002-R1: the router is platform-independent
        # runtime code; it gets native Windows verification like
        # the other three runtime suites. One step per suite: a
        # failure in one suite must not hide the others.
        shell: bash
        run: python tests/test_skill_router.py
      - name: Run script-to-performance suite
        # CF-WO-P1-003: the script-to-performance runtime is
        # platform-independent runtime code; it gets native
        # Windows verification like the other runtime suites.
        # One step per suite: a failure in one suite must not
        # hide the others.
        shell: bash
        run: python tests/test_script_to_performance_runtime.py
      - name: Run identity resolution suite
        # CF-WO-P1-005: the identity resolution suite (P1-004-R1)
        # and the production-store suite (P1-004-R1) are
        # platform-independent runtime code; both are Windows-safe
        # in structure (symlink tests catch OSError; POSIX mode
        # checks are gated on os.name == "posix"). One step per
        # suite: a failure in one suite must not hide the others.
        shell: bash
        run: python tests/test_identity_resolution.py
      - name: Run production store suite
        shell: bash
        run: python tests/test_production_store.py
      - name: Run media execution suite
        # CF-WO-P1-005: the media execution state machine, the
        # adapter suites and the timeline delivery suite are
        # platform-independent runtime code. The FFmpeg suite and
        # the pipeline group skip (exit 0, no conformance claimed)
        # where ffmpeg/ffprobe are absent; the OpenMontage group
        # skips where the component checkout is absent.
        shell: bash
        run: python tests/test_media_execution.py
      - name: Run FFmpeg adapter suite
        shell: bash
        run: python tests/test_ffmpeg_adapter.py
      - name: Run media adapters suite
        shell: bash
        run: python tests/test_media_adapters.py
      - name: Run timeline delivery suite
        shell: bash
        run: python tests/test_timeline_delivery.py
      - name: Run R4 timeline geometry suite
        # CF-WO-P1-005-R4 (C): the geometry suite is
        # platform-independent runtime code; its probe groups
        # skip where ffmpeg/ffprobe are absent (no conformance
        # claimed there), like the delivery suite above.
        shell: bash
        run: python tests/test_timeline_geometry.py
      - name: Run R4 VoiceStudio controls suite
        # CF-WO-P1-005-R4 (D): pure-Python mock-transport suite;
        # the registry-schema check inside it skips when
        # jsonschema is not installed.
        shell: bash
        run: python tests/test_voicestudio_controls.py
      - name: Run R4 provider contracts suite
        # CF-WO-P1-005-R4 (B): pure-Python mock-transport suite;
        # platform-independent runtime code.
        shell: bash
        run: python tests/test_provider_contracts.py
      # NOT run here (CF-WO-P1-005-R4, E): the URL-security
      # suite (its pinned-TLS group needs the openssl CLI) and
      # the end-to-end suite (it requires FFmpeg/ffprobe and
      # fails without them). Both run in p0-validate.
