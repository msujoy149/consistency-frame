non_hosts:
  - name: OpenRouter
    kind: model-routing layer
    is_agent_host: false
    notes: OpenRouter routes model calls; it is NOT an agent host and NOT a Brain host. Integrate via the actual Agent Runtime that hosts the Brain — never treat OpenRouter as a place where skills install or run.
  - name: Google Colab
    kind: notebook environment
    is_agent_host: false
    notes: Colab is a notebook environment, not an agent host. Using the Brain there needs an appropriate Notebook/Agent Runtime on top of Colab; no such runtime has been verified in this account.
knowledge_pack:
  definition: Brain Instructions + Skills + Project Context + Workflow Contracts, delivered as the repo itself (or a zip of it) for hosts without a native skill install.
  verified_hosts:
    - Muse
  untested_hosts:
    - Claude
    - Cursor
    - GitHub Copilot
rules:
  - Never claim universal native Skill support. Each host is verified separately.
  - A host is "supported" only after a real conformance test passes; until then it is untested.
  - The Brain source does not fork per host; adapters are thin.
  - When a new host is verified, add its evidence here and in registry/adapters.json; never edit history to backdate a claim.
