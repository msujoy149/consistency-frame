# Consistency Frame — Agent Compatibility Matrix (v2.4, P0)
# One canonical Brain source; thin adapters per host.
#
# HONESTY RULE: only Muse is verified, via the knowledge-pack path used
# in this account. Every other agent is untested unless real evidence
# exists on disk. "Untested" never means "unsupported" and never means
# "supported" — it means no conformance test has been run.
# Do NOT claim universal native Skill support.
#
# Statuses:
#   VERIFIED     — exercised in this account (see evidence). Usage-based:
#                  it means the knowledge-pack path is actually used in
#                  this account, NOT that a formal conformance test ran.
#                  Formal conformance is tracked separately per agent
#                  (formal_conformance_status); only a formal test
#                  (CF-P0-ADAPTER-001) can make it VERIFIED.
#   NOT_TESTED   — no conformance test has been run here.
# Native skill install values: SUPPORTED / UNSUPPORTED / NOT_TESTED.
# Media execution is tracked separately per agent (media_execution):
# a host that only directs companions/providers records "none".
