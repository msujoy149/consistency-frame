# Consistency Frame — Workflow Graph (v2.4, P0)
# Execution graph over the 15 skills. Routing rule: SEQUENTIAL when a stage
# depends on an earlier stage's output; PARALLEL only when safe (no dependency
# between the skills in the group). Every edge goes from a lower precedence to
# a higher precedence, so the graph is acyclic; topological order is the
# precedence order (1-15). command-authority (precedence 1) is the router: it
# selects and orders skills for every task (command-authority §2) and is
# therefore the source of the router edges below. resource-management
# (precedence 2) is cross-cutting: consulted at every phase boundary, not a
# pipeline stage, so it has no dependency edges — see cross_cutting.
# Composable routing (P0-006, canonical doc §10): video-type skills are NOT
# mutually exclusive alternatives. A production has ONE primary pathway, one
# or more visual-style profiles, subject-specific capabilities, and compatible
# layers that combine freely. Precedence is tie-breaking only, never
# exclusion. Only TRUE conflicts apply — two rules that cannot both hold for
# the SAME subject in the SAME shot (see true_conflicts). The old "at most
# ONE runs per video" exclusion was wrong: real productions mix styles,
# subjects, and media per shot (e.g. a stylized 3D short with a musical
# performance and a CG creature; a live-action plate with a generated
# creature and a title card), and the exclusion made those combinations
# indescribable. Per-character / per-shot representation is in
# `representation` below (production-profile per_subject_overrides /
# per_shot_overrides).
# video-regeneration BRACKETS the workflow: its §1 reference analysis runs
# FIRST and its §8 QC runs LAST (see sequential_chains -> video-regeneration).
# Validated by tests/test_routing.py and scripts/validate-repo.py (check 8).
# Routing rule: SEQUENTIAL when a stage depends on an earlier stage's output;
# PARALLEL only when safe (no dependency between the skills in the group).
# Every edge goes from a lower precedence to a higher precedence, so the graph
# is acyclic; topological order is the precedence order (1-15).
# command-authority (precedence 1) is the router: it selects and orders skills
# for every task (command-authority §2) and is therefore the source of the
# router edges below. resource-management (precedence 2) is cross-cutting: it
# is consulted at every phase boundary, not a pipeline stage, so it has no
# dependency edges — see cross_cutting.
# Composable routing (P0-006, canonical doc §10): video-type skills are NOT
# mutually exclusive alternatives. A production has ONE primary pathway, one
# or more visual-style profiles, subject-specific capabilities, and compatible
# layers that combine freely. Precedence is tie-breaking only, never
# exclusion. Only TRUE conflicts apply — two rules that cannot both hold for
# the SAME subject in the SAME shot (see true_conflicts). The old "at most
# ONE runs per video" exclusion was wrong: real productions mix styles,
# subjects, and media per shot (e.g. a stylized 3D short with a musical
# performance and a CG creature; a live-action plate with a generated
# creature and a title card), and the exclusion made those combinations
# indescribable. Per-character / per-shot representation is in
# `representation` below (production-profile per_subject_overrides /
# per_shot_overrides).
# DRAFT — do not copy into the repo without coordinator review.
version: "2.4"
router: command-authority
cross_cutting:
  - skill: resource-management
    note: |-
      Consulted at every phase boundary (resource-management §1-§3): voice
      plugin only for voice work, video plugin only for video assembly,
      working memory only for the current phase. Never a pipeline stage;
      never used to cut quality or skip QC (§8).
routing_model:
  # Composable routing (P0-006; canonical doc §10). The five layers below
  # replace the withdrawn "one video-type skill per video" exclusion.
  primary_pathway:
    description: |-
      One primary pathway per production, chosen from the production's
      dominant medium and purpose (e.g. kids-family-animation /
      cinematic-power for a stylized 3D short; realistic-person for a
      photorealistic digital-human video; live-action-vfx for a
      live-action-plus-creature video). The primary pathway supplies the
      production's main rules; it does not own the production exclusively.
    source: schemas/production-profile.json
  style_profiles:
    description: |-
      One or more visual-style profiles layer onto the primary pathway
      (e.g. the flat-2D explainer profile, an anime profile). A profile
      contributes its style lock, palette, and craft rules; it never
      vetoes an unrelated layer. A profile's style lock binds the shots
      it covers, per subject per shot — see true_conflicts TC-3/TC-4/TC-5.
    values: VISUAL_STYLE vocabulary (see SKILL_ROUTING_MATRIX.yaml header)
  subject_capabilities:
    description: |-
      Subject capabilities layer per subject: animal and creature
      performance, real-animal handling, age performance, instrument
      performance, and similar capabilities apply to the subjects they
      describe, in the shots those subjects appear in. Articulation
      follows the subject's own anatomy — see true_conflicts TC-1/TC-10.
  compatible_layers:
    description: |-
      Layers that do not conflict combine freely: voice-consistency,
      humanized-production, language-authenticity, production-systems,
      emotional-performance, and resource-management combine with any
      primary pathway. A production routinely runs many layers at once.
  true_conflicts_only:
    description: |-
      A conflict exists only when two rules genuinely cannot both hold
      for the same subject in the same shot. The absence of a stated
      conflict is not a conflict. A conflict is resolved by choosing
      per shot (or per subject), recording the choice, and never by
      silently dropping a rule. See true_conflicts below.
  precedence_tie_breaking:
    description: |-
      Where two layers both speak to the same decision, the routing
      matrix's precedence order decides which one speaks first; the
      other still applies where it does not contradict. Command
      authority remains the router (precedence 1): it routes, it does
      not generate.
representation:
  # Per-character / per-shot representation: a scene mixing subjects or
  # media carries different representations per character and per shot.
  # Canonical records: schemas/production-profile.json
  # (per_subject_overrides, per_shot_overrides), schemas/character.json
  # (subject_kind, articulation_target), schemas/shot-plan.json,
  # schemas/performance-plan.json (per-line articulation targets).
  per_character:
    - character_id
    - subject_kind
    - visual_style
    - production_medium
    - source_media
    - motion_method
    - articulation_target
    - interaction_pattern
  per_shot:
    - shot_id
    - subjects: per-subject representation (character_id plus the fields above)
    - visual_style per subject
    - source_media per element (captured vs generated, recorded honestly)
    - motion_method per subject
    - articulation_target per speaking subject
    - interaction_pattern
  rule: |-
    Two subjects in one shot may carry different representations (e.g. a
    photorealistic digital human talking with a stylized 3D creature);
    two shots in one production may carry different representations (e.g.
    a flat-2D explainer scene followed by a live-action plate). A single
    subject in a single shot carries exactly one value per dimension.
