edges:
  # Router edges: command-authority selects and orders each skill
  # (command-authority §2: skill commands take priority when they exist).
  - from: command-authority
    to: resource-management
    reason: Router consults resource discipline at every phase (command-authority §2; resource-management §1).
  - from: command-authority
    to: character-consistency
    reason: Router selects the character skill first for any video with a registered character (command-authority §2 step 2-3).
  - from: command-authority
    to: voice-consistency
    reason: Router selects the voice skill for any video with speaking characters (command-authority §2 step 3).
  - from: command-authority
    to: production-systems
    reason: Router selects the production layer for every series/episode production (command-authority §2 step 3).
  - from: command-authority
    to: language-authenticity
    reason: Router selects the language skill when dialogue spans languages (command-authority §2 step 3).
  - from: command-authority
    to: humanized-production
    reason: Router selects the humanization layer, which applies to every project (command-authority §2 step 3; humanized-production intro).
  - from: command-authority
    to: cinematic-power
    reason: Router selects the cinematic-power layer for trailer/music-video quality (command-authority §2 step 3).
  - from: command-authority
    to: emotional-performance
    reason: Router selects the emotional-performance layer for musical/intimate scenes (command-authority §2 step 3).
  - from: command-authority
    to: live-action-vfx
    reason: Router selects the live-action/VFX layer for live-action hybrid footage (command-authority §2 step 3).
  - from: command-authority
    to: kids-family-animation
    reason: Router selects this skill for kids/family animation, which also explicitly builds on command-authority (command-authority §2; kids-family-animation intro; registry/skills.json).
  - from: command-authority
    to: explainer-animation
    reason: Router selects the explainer skill for teaching/explainer animation (command-authority §2 step 3).
  - from: command-authority
    to: realistic-person
    reason: Router selects the realistic-person skill for photo-to-person video (command-authority §2 step 3).
  - from: command-authority
    to: agency-advertising
    reason: Router selects the advertising layer for agency campaigns (command-authority §2 step 3).
  - from: command-authority
    to: video-regeneration
    reason: Router selects the regeneration workflow when the user uploads a video to regenerate (command-authority §2 step 3).
  # Dependency edges: prerequisite -> dependent.
  - from: character-consistency
    to: voice-consistency
    reason: A voice profile is fixed per registered character (voice-consistency §1); cloning needs the character name plus ID (voice-consistency §13).
  - from: character-consistency
    to: agency-advertising
    reason: The model is a registered character, created through the Character Generator (agency-advertising intro; character-consistency §12.2).
  - from: character-consistency
    to: kids-family-animation
    reason: Builds on character-consistency (registry/skills.json; kids-family-animation intro).
  - from: character-consistency
    to: video-regeneration
    reason: Characters in the regenerated video are registered characters (video-regeneration intro; registry/skills.json).
  - from: character-consistency
    to: realistic-person
    reason: The photo is used exactly as given, per the Character Generator user-supplied picture rule (realistic-person §1; character-consistency §12.1).
  - from: voice-consistency
    to: language-authenticity
    reason: The same character voice profile speaks each language (language-authenticity §5; voice-consistency §9).
  - from: voice-consistency
    to: agency-advertising
    reason: The ad voice tone is performance direction only; the model's base voice stays fixed per voice-consistency (agency-advertising §1).
  - from: voice-consistency
    to: kids-family-animation
    reason: Builds on voice-consistency (registry/skills.json; kids-family-animation intro; §8).
  - from: voice-consistency
    to: video-regeneration
    reason: Voices in the regenerated video follow voice-consistency (video-regeneration intro; registry/skills.json).
  - from: voice-consistency
    to: realistic-person
    reason: The voice belongs to that person via a supplied/cloned voice (realistic-person §4; voice-consistency §13).
  - from: voice-consistency
    to: emotional-performance
    reason: One voice per character, fixed across episodes (emotional-performance intro; registry/skills.json).
  - from: voice-consistency
    to: humanized-production
    reason: Defers-to — the full dialogue, non-verbal voice, drift, and mix rules live in voice-consistency (humanized-production §30.2, §30.6, §30.12, §30.32).
  - from: production-systems
    to: language-authenticity
    reason: Captions and dubbing packs per language (language-authenticity §7; production-systems B15, D2).
  - from: production-systems
    to: humanized-production
    reason: Defers-to — the episode QC checklist and script-driven colour grading live in production-systems (humanized-production §30.11, §30.15; production-systems A11, C7).
  - from: production-systems
    to: cinematic-power
    reason: Builds on production-systems — style bible, camera language, shot list, angles (registry/skills.json; cinematic-power intro).
  - from: production-systems
    to: emotional-performance
    reason: Builds on production-systems — style bible, camera language, shot list, angles (registry/skills.json; emotional-performance intro).
  - from: production-systems
    to: live-action-vfx
    reason: Builds on production-systems — camera language, shot list, angles (registry/skills.json; live-action-vfx intro).
  - from: production-systems
    to: video-regeneration
    reason: Builds on production-systems (registry/skills.json; video-regeneration intro).
  - from: humanized-production
    to: cinematic-power
    reason: Builds on humanized-production — performance, micro-motion, sound, editing (registry/skills.json; cinematic-power intro).
  - from: humanized-production
    to: emotional-performance
    reason: Builds on humanized-production — performance, micro-motion, sound, editing (registry/skills.json; emotional-performance intro).
  - from: humanized-production
    to: live-action-vfx
    reason: Builds on humanized-production — performance, physics, editing (registry/skills.json; live-action-vfx intro).
  - from: humanized-production
    to: kids-family-animation
    reason: Builds on humanized-production (registry/skills.json; kids-family-animation intro).
  - from: humanized-production
    to: video-regeneration
    reason: Builds on humanized-production (registry/skills.json; video-regeneration intro).
  - from: humanized-production
    to: realistic-person
    reason: Backgrounds are detailed, deep, and alive per humanized-production (realistic-person §5; humanized-production §30.36).
  - from: cinematic-power
    to: emotional-performance
    reason: Builds on cinematic-power — style lock, music-beat editing, scale and colour scripting (registry/skills.json; emotional-performance intro).
  - from: cinematic-power
    to: live-action-vfx
    reason: Builds on cinematic-power — style lock, creature performance, trailer structure, scale and colour scripting (registry/skills.json; live-action-vfx intro).
  - from: cinematic-power
    to: kids-family-animation
    reason: Builds on cinematic-power (registry/skills.json; kids-family-animation intro).
  - from: language-authenticity
    to: realistic-person
    reason: Lip-sync follows the sounds of the language being spoken (realistic-person §4; language-authenticity §6).
parallel_groups:
  - name: foundation-planning
    skills:
      - character-consistency
      - production-systems
    reason: |-
      No dependency between them (production-systems lists no dependencies):
      character identity can be locked while the style bible, shot list, and
      story bible are planned; both read the script and the registry.
  - name: language-and-humanization-prep
    skills:
      - language-authenticity
      - humanized-production
    reason: |-
      No dependency between them: both depend on voice-consistency and
      production-systems, which are already complete, and neither consumes
      the other's output.
  - name: performance-layers-different-scenes
    skills:
      - emotional-performance
      - live-action-vfx
    reason: |-
      No dependency between them: both depend on production-systems,
      humanized-production, and cinematic-power. They may run in parallel
      only for DIFFERENT scenes of one video (a musical/intimate scene vs a
      live-action/VFX scene), never on the same shot.
conditional_parallel_groups:
  # Parallel ONLY under the stated condition. These groups are kept apart
  # from parallel_groups because the two skills ARE dependent in the general
  # case (edge character-consistency -> voice-consistency); the condition
  # below is the only case where the parallel read is safe.
  - name: existing-character-prep
    skills:
      - character-consistency
      - voice-consistency
    condition: |-
      ONLY when the character is ALREADY registered: resolving the stored
      visual record and loading the stored voice profile are independent
      reads. For a NEW character this group does NOT apply — the voice
      profile is fixed per registered character (voice-consistency §1), so
      character registration runs first (edge character-consistency ->
      voice-consistency).
    reason: Independent registry reads for an already-registered character.
exclusive_groups:
  - name: video-type-layers
    skills:
      - kids-family-animation
      - explainer-animation
      - realistic-person
      - agency-advertising
    reason: |-
      Mutually exclusive alternatives — at most ONE runs per video.
      kids-family-animation is animation, not a realistic person
      (kids-family-animation §2); explainer-animation is none of anime, 3D
      CG, live-action, music video, or trailer (explainer-animation intro);
      realistic-person is neither animation nor live-action footage
      (realistic-person §6); agency-advertising is a campaign layer on a
      synthetic spokesperson (agency-advertising intro). cinematic-power is
      NOT in this group: it is a layer that other types build on.
sequential_chains:
  - name: registration
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
    note: REGISTER_CHARACTER then REGISTER_VOICE_PROFILE; voice profile is fixed per registered character (voice-consistency §1).
  - name: scripted-series-episode
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - language-authenticity
      - humanized-production
      - cinematic-power
    note: Core pipeline for a scripted episode; append exactly one video-type layer (kids/explainer/realistic/agency) or a performance layer (emotional/live-action) as the script requires. Final QC is production-systems A11 plus the type skill's own checks.
  - name: emotional-musical-scene
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - cinematic-power
      - emotional-performance
    note: Follows the registry builds-on chain for emotional-performance.
  - name: live-action-vfx-scene
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - cinematic-power
      - live-action-vfx
    note: Follows the registry builds-on chain for live-action-vfx.
  - name: kids-family-animation
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - cinematic-power
      - kids-family-animation
    note: Follows the registry builds-on chain for kids-family-animation; the user gives only the script (kids-family-animation §15).
  - name: explainer-animation
    skills:
      - command-authority
      - production-systems
      - explainer-animation
    note: Explainer-animation states no builds-on dependency; production-systems supplies the planning layer (shot list, format) and command-authority routes. Voice/language apply via command-authority routing if the explainer has dialogue — not stated in the skill (see NOTES.md).
  - name: realistic-person-video
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - language-authenticity
      - humanized-production
      - realistic-person
    note: Follows realistic-person §1/§4/§5 references; consent record required before generation (§1).
  - name: advertising-campaign
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - agency-advertising
    note: Model registered first (character-consistency §12.2), brand kit locked, then campaign; client approval of the exact version precedes publish (agency-advertising §7).
  - name: video-regeneration
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - video-regeneration
    note: |-
      video-regeneration BRACKETS the workflow rather than sitting only at
      the end: its §1 complete reference analysis runs FIRST (before any
      generation), the foundation skills then supply identity/voice/planning/
      humanization, and its §8 mandatory QC runs LAST. Working order,
      always: analyse, plan, generate, inspect and correct (video-regeneration
      intro; §9).
