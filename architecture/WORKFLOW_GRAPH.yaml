parallel_groups:
  - name: foundation-planning
    skills:
      - character-consistency
      - production-systems
    reason: |-
      No dependency between them (production-systems lists no dependencies):
      character identity can be locked while the style bible, shot list, and
      story bible are planned; both read the script and the registry.
  - name: language-and-humanization-prep
    skills:
      - language-authenticity
      - humanized-production
    reason: |-
      No dependency between them: both depend on voice-consistency and
      production-systems, which are already complete, and neither consumes
      the other's output.
  - name: performance-layers-different-scenes
    skills:
      - emotional-performance
      - live-action-vfx
    reason: |-
      No dependency between them: both depend on production-systems,
      humanized-production, and cinematic-power. They may run in parallel
      only for DIFFERENT scenes of one video (a musical/intimate scene vs a
      live-action/VFX scene), never on the same shot.
  - name: composable-pathways-different-shots
    skills:
      - kids-family-animation
      - explainer-animation
      - realistic-person
      - agency-advertising
    reason: |-
      No dependency between them, and no true conflict between them at
      production level: the former video-type skills may run in parallel
      only for DIFFERENT shots (or different subjects) of one video — a
      flat-2D explainer scene, an animated scene, a digital-human shot,
      and an ad cut-down in one production. True conflicts TC-2..TC-9
      still apply to the SAME subject in the SAME shot.
conditional_parallel_groups:
  # Parallel ONLY under the stated condition. These groups are kept apart
  # from parallel_groups because the two skills ARE dependent in the general
  # case (edge character-consistency -> voice-consistency); the condition
  # below is the only case where the parallel read is safe.
  - name: existing-character-prep
    skills:
      - character-consistency
      - voice-consistency
    condition: |-
      ONLY when the character is ALREADY registered: resolving the stored
      visual record and loading the stored voice profile are independent
      reads. For a NEW character this group does NOT apply — the voice
      profile is fixed per registered character (voice-consistency §1), so
      character registration runs first (edge character-consistency ->
      voice-consistency).
    reason: Independent registry reads for an already-registered character.
true_conflicts:
  # TRUE conflicts only: each rule names the two operations that cannot
  # coexist, the scope in which they collide (same subject, same shot),
  # and the resolution. These replace the withdrawn exclusive_groups
  # ("video-type-layers": at most ONE runs per video). Nothing here is a
  # global exclusion: the same two skills may both run in one production
  # on different subjects or different shots. The routing matrix's
  # `conflicts` lists only the blocking pairs the resolver enforces
  # (explainer-animation / realistic-person, TC-4, and live-action-vfx /
  # realistic-person, TC-2). The other rules here are scoped: the pair CAN
  # combine in one production across different subjects or shots (e.g.
  # TC-7: cinematic-power + realistic-person in scenario s4; TC-1:
  # cinematic-power + live-action-vfx in scenario s5).
  - id: TC-1
    skills: [live-action-vfx, cinematic-power]
    scope: same animal/creature subject, same shot
    rule: |-
      Real-animal non-speaking performance cut from real behaviour
      (live-action-vfx §6) vs anthropomorphic speaking-animal/creature
      direction (cinematic-power §2). A real animal must not be directed
      to speak with human lips, and a real animal and a CG creature must
      not be mixed into one animal (live-action-vfx §6).
    resolution: choose per subject per shot — real behaviour OR anthropomorphic direction — and record the choice.
  - id: TC-2
    skills: [live-action-vfx, realistic-person]
    scope: same subject, same shot
    rule: |-
      Captured live-action footage of a real shoot (live-action-vfx: real
      footage is the input) vs a generated digital human from a still
      photo (realistic-person §6: neither animation nor live-action
      footage). A generated element is never passed off as captured, and
      captured footage is never described as generated (source honesty).
    resolution: choose per subject per shot — captured footage OR generated digital human — and record the choice; record source_media honestly per element.
  - id: TC-3
    skills: [explainer-animation, cinematic-power]
    scope: same shot, visual_style dimension
    rule: |-
      Flat-2D-vector style lock (explainer-animation §1, §7) vs anime /
      stylized-3D / photorealistic styling (cinematic-power §1 style-lock
      choices). One shot cannot hold both style locks.
    resolution: choose the style per shot and record it; other cinematic-power layers (music-beat, title cards) may still apply to other shots.
  - id: TC-4
    skills: [explainer-animation, realistic-person]
    scope: same subject, same shot, visual_style dimension
    rule: |-
      Flat-2D-vector explainer profile vs photorealistic-digital-human
      (realistic-person intro). One subject in one shot cannot be both a
      flat 2D vector figure and a photorealistic digital human.
    resolution: choose the representation per subject per shot and record it.
  - id: TC-5
    skills: [explainer-animation, kids-family-animation]
    scope: same shot, visual_style dimension
    rule: |-
      Flat-2D explainer profile (explainer-animation §1: no anime
      styling, no 3D look, no photorealism; the two character designs
      kept apart) vs an anime / 3D / photorealistic kids-family style in
      the same shot. A flat-2D kids-family scene does NOT conflict — the
      conflict is only the style values in the same shot.
    resolution: choose the style per shot and record it.
  - id: TC-6
    skills: [kids-family-animation, realistic-person]
    scope: same subject, same shot, visual_style dimension
    rule: |-
      Animated character (kids-family-animation §2) vs photorealistic
      digital human from a real person's photo (realistic-person §1).
      One subject in one shot cannot be both.
    resolution: choose the representation per subject per shot and record it.
  - id: TC-7
    skills: [cinematic-power, realistic-person]
    scope: same subject, same shot, visual_style dimension
    rule: |-
      2D/3D-animation styling (cinematic-power §1: 2D anime, 3D stylized
      CG) vs photorealistic digital human (realistic-person §6: not
      2D/3D animation). One subject in one shot cannot be both.
    resolution: choose the representation per subject per shot and record it.
  - id: TC-8
    skills: [agency-advertising, realistic-person]
    scope: same subject
    rule: |-
      Synthetic spokesperson who must never resemble a real person
      (agency-advertising §5) vs a photorealistic digital human built
      from a real person's photo (realistic-person §1). One subject
      cannot be both synthetic and a real person's likeness.
    resolution: choose per subject — synthetic spokesperson OR real-person digital human — and record the choice; consent rules for the real-person path still apply.
  - id: TC-9
    skills: [explainer-animation, live-action-vfx]
    scope: same shot
    rule: |-
      Flat-2D-vector explainer profile vs captured live-action footage
      in the same shot (explainer-animation intro: none of anime, 3D CG,
      live-action, music video, or trailer; live-action-vfx: real
      footage is the input). One shot cannot be both flat 2D vector and
      captured live-action footage.
    resolution: choose the medium per shot and record it.
  - id: TC-10
    skills: [character-consistency, voice-consistency, language-authenticity]
    scope: same subject, same shot (per dialogue line)
    rule: |-
      Articulation target must match the subject's own anatomy:
      human-mouth-lips only for human/digital-human subjects, bird-beak
      for birds, animal-muzzle for animals, creature-jaw-mandibles for
      creatures. Human lip-sync on a bird (or beak articulation on a
      human) is invalid. This is a dimension rule, not a skill-vs-skill
      exclusion — the three skills constrain it jointly, so it is not
      mirrored in any single skill's `conflicts` list.
    resolution: set articulation_target per subject from its anatomy (schemas/character.json, schemas/performance-plan.json); reject a line whose articulation target contradicts its subject.
sequential_chains:
  - name: registration
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
    note: REGISTER_CHARACTER then REGISTER_VOICE_PROFILE; voice profile is fixed per registered character (voice-consistency §1).
  - name: scripted-series-episode
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - language-authenticity
      - humanized-production
      - cinematic-power
    note: Core pipeline for a scripted episode; append the primary pathway and the layers the script requires — several may combine (e.g. kids-family-animation + emotional-performance + cinematic-power). True conflicts (TC-1..TC-10) are resolved per subject per shot, never by dropping a layer globally. Final QC is production-systems A11 plus each applied skill's own checks.
  - name: emotional-musical-scene
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - cinematic-power
      - emotional-performance
    note: Follows the registry builds-on chain for emotional-performance.
  - name: live-action-vfx-scene
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - cinematic-power
      - live-action-vfx
    note: Follows the registry builds-on chain for live-action-vfx.
  - name: kids-family-animation
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - humanized-production
      - cinematic-power
      - kids-family-animation
    note: Follows the registry builds-on chain for kids-family-animation; the user gives only the script (kids-family-animation §15).
  - name: explainer-animation
    skills:
      - command-authority
      - production-systems
      - explainer-animation
    note: Explainer-animation states no builds-on dependency; production-systems supplies the planning layer (shot list, format) and command-authority routes. Voice/language apply via command-authority routing if the explainer has dialogue — not stated in the skill (see NOTES.md).
  - name: realistic-person-video
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - language-authenticity
      - humanized-production
      - realistic-person
    note: Follows realistic-person §1/§4/§5 references; consent record required before generation (§1).
  - name: advertising-campaign
    skills:
      - command-authority
      - character-consistency
      - voice-consistency
      - production-systems
      - agency-advertising
    note: Model registered first (character-consistency §12.2), brand kit locked, then campaign; client approval of the exact version precedes publish (agency-advertising §7).
  - name: digital-human-dialogue-with-animal
    skills:
      - command-authority
      - character-consistency
