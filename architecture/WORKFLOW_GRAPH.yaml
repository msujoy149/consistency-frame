# Consistency Frame — Workflow Graph (v2.4, P0)
# Execution graph over the 15 skills. Routing rule: SEQUENTIAL when a stage
# depends on an earlier stage's output; PARALLEL only when safe (no dependency
# between the skills in the group). Every edge goes from a lower precedence to
# a higher precedence, so the graph is acyclic; topological order is the
# precedence order (1-15). command-authority (precedence 1) is the router: it
# selects and orders skills for every task (command-authority §2) and is
# therefore the source of the router edges below. resource-management
# (precedence 2) is cross-cutting: consulted at every phase boundary, not a
# pipeline stage, so it has no dependency edges — see cross_cutting.
# Video-type skills (kids-family-animation, explainer-animation,
# realistic-person, agency-advertising) are mutually exclusive alternatives:
# at most ONE runs per video. Their precedence order is tie-breaking only,
# never a pipeline sequence. See exclusive_groups.
# video-regeneration BRACKETS the workflow: its §1 reference analysis runs
# FIRST and its §8 QC runs LAST (see sequential_chains -> video-regeneration).
# Validated by tests/test_routing.py and scripts/validate-repo.py (check 8).
# Routing rule: SEQUENTIAL when a stage depends on an earlier stage's output;
# PARALLEL only when safe (no dependency between the skills in the group).
# Every edge goes from a lower precedence to a higher precedence, so the graph
# is acyclic; topological order is the precedence order (1-15).
# command-authority (precedence 1) is the router: it selects and orders skills
# for every task (command-authority §2) and is therefore the source of the
# router edges below. resource-management (precedence 2) is cross-cutting: it
# is consulted at every phase boundary, not a pipeline stage, so it has no
# dependency edges — see cross_cutting.
# Video-type skills (kids-family-animation, explainer-animation,
# realistic-person, agency-advertising) are mutually exclusive alternatives:
# at most ONE runs per video. Their precedence order is tie-breaking only,
# never a pipeline sequence. See exclusive_groups.
# DRAFT — do not copy into the repo without coordinator review.
version: "2.4"
router: command-authority
cross_cutting:
  - skill: resource-management
    note: |-
      Consulted at every phase boundary (resource-management §1-§3): voice
      plugin only for voice work, video plugin only for video assembly,
      working memory only for the current phase. Never a pipeline stage;
      never used to cut quality or skip QC (§8).
