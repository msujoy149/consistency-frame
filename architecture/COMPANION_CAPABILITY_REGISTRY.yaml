# Consistency Frame — Companion Capability Registry (v2.4, P0)
# Canonical record of what the two companion specialists can do.
#
# HONESTY RULE: a capability or interface is listed only with evidence
# found in the local plugin copy on disk (components/voicestudio,
# components/openmontage), an inspection of the companion upstream at
# its pinned commit, or a recorded local run. The Brain directs the
# companions; it never silently modifies or replaces their internal code.
#
# evidence_level (closed set — P0-002 §6; this field REPLACED the old
# `status` field, whose three values (VERIFIED_ON_DISK / VERIFIED_BY_RUN
# / NOT_VERIFIED) conflated "present on disk" with "verified" and let a
# single "verified" total hide how little was actually exercised):
#   upstream_inspected_pinned_commit — the claim was inspected in the
#     companion upstream at the pinned commit recorded on the companion
#     (evidence names the file + the pinned commit). The claim itself
#     (e.g. a headline language count) is NOT independently verified
#     and must never be reported as exercised or production-proven.
#   present_locally — present in components/, not exercised. Code,
#     routes, schemas or docs exist on disk; no run was recorded here.
#   exercised_recorded_run — exercised in a recorded local run. MUST
#     carry a run_reference (date + what was run + where it is
#     recorded). A run reference is never invented.
#   production_verified — only with a production record, carried in a
#     production_record field. EXPECT ZERO in this account: no
#     production run exists, so no capability or interface may claim
#     this level. The validator and tests enforce the zero.
#
# CORE-ONLY INSTALL NOTE: a core-only install (`bash setup.sh`, the
# default) does NOT include VoiceStudio or OpenMontage. The companions
# are installed only with the opt-in `bash setup.sh --with-components`
# (see docs/06-installation.md). Nothing in this registry implies the
# companions are present after a core-only install.
#
# COMMERCIAL-USE RULE (Correction E, 2026-11-22): technical capability is
# NOT commercial approval. A companion/model can be technically capable
# (exercised in a recorded run) and still NOT approved for commercial
# production. `commercial_use_approved: false` means "not cleared in this
# registry" — either because the licence forbids commercial use
# (`commercial_use_reason: noncommercial_licence`, e.g. CC-BY-NC weights)
# or because no reviewed commercial clearance exists
# (`commercial_use_reason: unverified` — a permissive-looking upstream
# metadata label is not a clearance; see
# components/voicestudio/backend/config/model_licenses.json, whose scope
# note states "No commercial clearance is asserted by the initial
# inventory"). Monetised/commercial YouTube production must use a voice
# provider whose licence is verified to cover commercial use; no such
# provider is verified in this registry, so the commercial voice adapter
# is UNSUPPORTED until one is. Never mark a capability
# `production_verified` without a production record (expect zero).
#
# Companion pins (must match setup.sh): VoiceStudio
# 2f2f5a9b0e982c6147efc6baaeae62936f29b79b, OpenMontage
# fecb9a1e3cc23ef84de30b272059457a427f16f8.
