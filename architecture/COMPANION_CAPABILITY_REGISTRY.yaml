# ---------------------------------------------------------------------------
# Providers (P1-004): generic media provider capability records.
# Separate from reasoning hosts (see architecture/AGENT_COMPATIBILITY_MATRIX.yaml)
# and from the two companions above (VoiceStudio / OpenMontage), which are
# also listed here as providers where they execute media work.
#
# Conformance vocabulary (matches schemas/provider-capability.json):
#   VERIFIED   — a formal conformance test passed.
#   EXERCISED  — the capability was exercised in a recorded run, but no
#                formal conformance test exists.
#   NOT_TESTED — no evidence.
#   FAILED     — a conformance test failed.
# Matching prefers VERIFIED, then EXERCISED; NOT_TESTED and FAILED are
# never matched — tasks for them compile as provider-neutral handoffs.
#
# Commercial rule: commercial_use_approved is false unless a commercial
# route was independently cleared. The default OmniVoice weights are
# CC-BY-NC and must never be routed for monetised or commercial
# production. A named external provider is not a verified commercial
# provider until its terms are checked and recorded here.
# Paid routes: no live paid call was made in this account; every paid
# route needs the user's explicit approval and keys per call.
# ---------------------------------------------------------------------------
providers:
  - provider_id: provider-voicestudio-omnivoice
    schema_version: "2.5"
    provider_type: voice-tts
    operations: [generate-speech, clone-voice, transcribe]
    input_constraints: ["text plus a voice profile id", "reference audio for cloning"]
    output_constraints: ["wav audio", "single speaker per call"]
    reference_image_capability: false
    character_reference_capability: false
    audio_capability: true
    native_camera_controls: []
    native_motion_controls: []
    cost_model: local-free
    authorization_required: false
    privacy_transmission: local-only; no transmission to any provider
    licence: "CC-BY-NC weights (noncommercial); application AGPL-3.0"
    commercial_use_approved: false
    commercial_use_reason: noncommercial_licence
    # R4-D: voice controls the bundled OmniVoice engine genuinely
    # forwards (verified against components/voicestudio 2026-11-27).
    # Only "supported" controls are ever sent; "unsupported" ones
    # are refused with a precise capability error, never silently
    # dropped. Instruct carries fixed English tags only; speed is
    # a number (from a numeric speaking_pace); seed is forwarded.
    voice_controls:
      supported: [instruct, speed, seed]
